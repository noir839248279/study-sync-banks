name: Review and publish a bank
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Reviewed submission Issue number
        required: true
        type: string
      action:
        description: Publish a reviewed snapshot or remove from catalog
        required: true
        type: choice
        options: [publish, unlist]
      sha256:
        description: SHA-256 of the JSON file you downloaded and reviewed (required for publish)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: community-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
      - name: Validate and publish the reviewed data
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue }}
          PUBLISH_ACTION: ${{ inputs.action }}
          REVIEW_SHA256: ${{ inputs.sha256 }}
        run: node scripts/publish.mjs
      - name: Commit catalog snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if test -d banks; then git add banks; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reviewed community catalog'
            git push origin HEAD:main
          fi
